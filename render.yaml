services:
  - type: web
    name: clinic-booking-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: API_KEY
        sync: false          # paste the key in the Render dashboard
      - key: DATABASE_URL
        sync: false          # paste the Neon connection string
