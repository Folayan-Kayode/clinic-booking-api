name: keep-alive

# Free Render instances sleep after ~15 minutes without traffic and then take
# ~50 s to wake up. Pinging /health keeps the booking API responsive for the
# assessment checks.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL || 'https://clinic-booking-api-zysc.onrender.com' }}
        run: |
          echo "Pinging $SERVICE_URL/health"
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 90 "$SERVICE_URL/health")
          cat /tmp/body || true
          echo
          test "$code" = "200"
